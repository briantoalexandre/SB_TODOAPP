<div xmlns:th="http://www.thymeleaf.org">
    <header th:fragment="header(activePage)"
            class="bg-light border-bottom">
        <div class="container d-flex align-items-center py-2">
            <!-- Logo de l'application -->
            <a th:href="@{/}" class="me-4">
                <img th:src="@{/images/favicon.ico}"
                     alt="TodoApp"
                     width="40"
                     height="40">
            </a>
            <!-- Barre de navigation -->
            <div th:replace="~{fragments/navbar :: navbar(${activePage})}"></div>

                <!-- Liste déroulante des utilisateurs -->
                <div class="ms-auto d-flex align-items-center gap-2">

                    <label for="utilisateurId" class="text-nowrap">
                        <i class="bi bi-key-fill"></i>
                        Utilisateur :
                    </label>

                    <select id="utilisateurId"
                            name="utilisateurId"
                            class="form-select form-select-sm">

                        <option value="" disabled
                                th:selected="${utilisateurActif == null}">
                            Choisir un utilisateur
                        </option>

                        <option th:each="utilisateur : ${utilisateurs}"
                                th:value="${utilisateur.idUtilisateur}"
                                th:text="${utilisateur.prenom + ' ' + utilisateur.nom}"
                                th:selected="${utilisateurActif != null and utilisateur.idUtilisateur == utilisateurActif.idUtilisateur}">
                        </option>

                    </select>
                </div>

            </div>
        </div>
    </header>
</div>
